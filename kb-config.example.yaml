# Per-project config for the kb-skills pipelines.
# Copy to kb-config.yaml at your vault root and fill in.
#
# Every value here used to be hardcoded in the scripts. Nothing project-specific
# belongs in skill code.
#
# PATHS ARE RELATIVE to the vault root. Absolute paths, ~ and .. traversal are
# rejected — the scripts refuse to run rather than write outside the vault. This
# is enforced, not conventional: Python lets an absolute value replace the root
# entirely while PowerShell's Join-Path does not, so the same file would mean two
# different things depending on which pipeline read it.
#
# CREDENTIALS never live here. Jira reads ATLASSIAN_EMAIL and ATLASSIAN_API_KEY
# from the environment, .env, or .env.local. The historical misspelling
# ATLASIAN_* (one S) is still accepted with a warning so existing vaults keep
# running.
#
# JSON is still accepted (kb-config.json) so projects can migrate at their own
# pace. YAML needs PyYAML in Python; graph-fetch.ps1 installs powershell-yaml on
# demand, the same way it installs the Microsoft.Graph modules.

project:
  name: myproject
  keywords:
    - myproject
    - add terms that identify your project in mail and chat

jira:
  enabled: false
  base_url: https://yourorg.atlassian.net
  project_key: PROJ
  # Rendered Markdown, one file per issue. Committed — this is the artefact.
  output_dir: .raw/jira
  # Verbatim API payloads. Gitignored and disposable: they exist so the renderer
  # can be fixed and re-run (--render-only) without re-fetching the project,
  # which costs Atlassian API points. Delete freely; the next run refills it.
  cache_dir: .cache/jira

wiki_publish:
  enabled: false
  # Target wiki platform: "github" (default) or "gitlab".
  # GitHub Wiki uses Home.md (capital H) as landing page; GitLab uses home.md.
  target: github
  repo: git@github.com:user/project.wiki.git
  branch: main
  # push.sh resolves vpn_host and aborts unless it lands under
  # vpn_private_prefix. Set vpn_required to false outside a corporate network.
  vpn_required: false
  vpn_host: github.com
  vpn_private_prefix: "10."

m365:
  enabled: false

  modules:
    emails: true
    chats: true
    teams_channels: true
    attachments: true
    chat_attachments: true
    # transcripts requires the OnlineMeetingTranscript.Read.All delegated scope,
    # which needs admin consent. Enabling it without consent makes the whole
    # sign-in fail, not just this module.
    transcripts: false
    sharepoint: false

  # Enabling sharepoint requires site_host and site_path.
  sharepoint:
    site_host: ""
    site_path: ""
    folder_path: ""
    max_depth: 3

  output:
    dir: .raw/msoffice
    attachments_dir: .raw/msoffice/attachments
    chat_attachments_dir: .raw/msoffice/chat-attachments
    transcripts_dir: .raw/msoffice/transcripts
    sharepoint_dir: .raw/sharepoint

  window:
    hours: 24
    top: 100
    chat_limit: 50

# --- vault tooling (wiki-search / wiki-vetting) ---
# Optional: without these sections everything targets a local Ollama on
# 127.0.0.1:11434. Values support ${VAR} and ${VAR:-default} macros expanded
# from the environment (process env, then vault-root .env / .env.local —
# see .env.example). CLI flags beat config values.

embeddings:
  # wiki-search index model (multilingual recommended: bge-m3, qwen3-embedding)
  model: ${WIKI_SEM_MODEL:-bge-m3}
  endpoint: ${WIKI_OLLAMA_URL:-http://127.0.0.1:11434}
  # Index location (relative to vault root). Derived cache: deletable anytime.
  db: .cache/wiki-search/index.db
  # Markdown source directories, relative to the vault root. Default: [wiki].
  # Git ignore rules apply. Add "." only to explicitly include the vault root.
  source_dirs:
    - wiki

# --- per-search overrides ---
# `embeddings` is the shared fallback. Each search skill also reads its own
# section, and its own section wins key by key, so wiki search and code search
# can use different models and endpoints from one file. Neither section is a
# fallback for the other: a wiki model must never reach the code index.
#
# Precedence per key: <skill section>.<key> -> embeddings.<key> -> default.
# Blank strings count as unset, so `model: ""` falls through to `embeddings`.
#
# wiki_search:                     # wiki-search (Markdown vault pages)
#   model: ${WIKI_SEM_MODEL:-bge-m3}
#   endpoint: ${WIKI_OLLAMA_URL:-http://127.0.0.1:11434}
#   db: .cache/wiki-search/index.db
#   source_dirs: [wiki]
#   # Instruction-aware models only (qwen3-embedding, e5-instruct): the prefix
#   # goes on the QUERY, documents are embedded unchanged. Omitting it raises
#   # nothing and only relevance drops (0.478 vs 0.771 MRR on a code corpus).
#   query_prefix: "Instruct: Given a wiki search query, retrieve the page that answers it\nQuery:"
#
# code_search:                     # code-search (source files)
#   model: ${CODE_SEM_MODEL:-qwen3-embedding:0.6b}
#   endpoint: ${CODE_OLLAMA_URL:-http://127.0.0.1:11434}
#   source_dirs: [projects]
#   query_prefix: "Instruct: Given a code search query, retrieve the source file that implements it\nQuery:"
#   vector_weight: 8
#   bm25_weight: 1

# --- output trust (wiki-search) ---
# An answer or summary an agent files back into the wiki is a CLAIM, not
# knowledge, until its status says it was checked. Without this section every
# page is indexed, which is the pre-trust behavior. With `output_types` set,
# pages of those types are indexed only when their `status:` appears in
# `indexed_status` (default: [verified]); everything else stays out of the
# index and is reported as quarantined by `build` and `status`.
#
# Only the listed types are gated. A concept in `draft` is still indexed: the
# gate is about self-authored output re-entering the retrieval corpus, not
# about every page's maturity.
#
# `require_evidence: true` additionally withholds a page whose status already
# qualifies but has no `evidence:` (scalar or list) — a `verified` page nobody
# can check against anything. Off by default; run wiki-vetting's lifecycle
# audit first to see how many pages would be affected.
#
#trust:
#  output_types: [question, summary]
#  indexed_status: [verified]
#  require_evidence: false

code_search:
  # Independent code index, stored under .cache/code-search/.
  # Inherits embeddings.model/endpoint; source_dirs is NOT inherited.
  source_dirs:
    - projects
  # Optional: override extensions or model/endpoint for this index only.
  # extensions: [.java, .py, .ts, .xml, .yaml, .json, .toml, .sh]
  # model: bge-m3
  # endpoint: ${WIKI_OLLAMA_URL}
  # "Instruction-aware" models (qwen3-embedding) perform much better when the
  # instruction goes on the QUERY only: MRR 0.771 vs 0.478 measured on 20 code
  # queries. Without it they degrade silently.
  # RRF fusion weights in hybrid mode. Default 8 / 1: BM25 is much weaker than
  # embeddings on code (MRR 0.24 vs 0.77 measured), and equal weights dropped
  # hybrid to 0.50. BM25 still contributes on configuration files.
  # vector_weight: 8
  # bm25_weight: 1
  # query_prefix: "Instruct: Given a code search query, retrieve the source file that implements it\nQuery:"

decisions:
  # wiki-vetting System One server (base URL; /v1/systemone is appended).
  # questions are a RECORD keyed by id.
  model: ${WIKI_VET_MODEL:-clef-flash:9b}
  endpoint: ${WIKI_OLLAMA_URL:-http://127.0.0.1:11434}
  # Per-axis decision thresholds. A single 0.5 cut for every axis accepts
  # unsupported quotes: the axes differ in cost and in how well the model
  # separates them. Tune with `scripts/calibration.py` over a labelled set —
  # never by feel. `band` marks the window around a threshold where the axis is
  # undecided and the claim goes to `review`.
  # thresholds:
  #   grounded: 0.90    # quote must explicitly support the claim
  #   durable: 0.60     # stable fact vs transient note
  #   duplicate: 0.75   # index coverage
  #   sensitive: 0.30   # low bar: prefer over-flagging secrets
  #   band: 0.05

repos:
  # Related repos this KB tracks (wiki-git-ingest). Map keyed by name; the
  # value is a git remote URL — exactly what git understands in .git/config,
  # any forge. Tracked with git + YOUR credentials (blobless bare mirror in
  # .cache/remotes/); new tags become claims. ${VAR} macros work.
  # Scalar form:
  your-service: git@github.com:your-org/your-service.git
  # Mapping form (adds target_page; default wiki/x-radar/<name>.md):
  llama-cpp:
    remote: https://github.com/ggml-org/llama.cpp.git
    target_page: wiki/x-radar/llama-cpp.md
  # Azure DevOps, any ssh/https remote:
  #azure-repo: git@ssh.dev.azure.com:v3/your-org/your-project/your-repo
  # Existing local clone instead of a mirror (changelog + conventional commits):
  #my-spike:
  #  path: ../my-project-spike

# --- tag vocabulary (wiki-lint: lint-tag-taxonomy) ---
# Optional: without this section the check skips. With a vocabulary, any page
# tag outside it is a lint finding — and off-vocabulary tags whose normalized
# form (accents/separators/singular) matches one allowed tag get an
# actionable hint instead of a bare violation. ${VAR} macros work;
# case-insensitive by default (set case_sensitive: true to change).
# Every run refreshes the derived registry .cache/tag-registry.json;
# `lint-tag-taxonomy.py --survey` prints the inventory + near-duplicate
# clusters to curate these two keys.

#tags:
#  allowed: [source, jira, entity, meta, security, deliverable]
#  aliases:
#    kick-off: kickoff        # known variant -> canonical allowed tag
#  case_sensitive: false

# --- page layout mapping (wiki-lint: lint-misplaced-pages) ---
# Optional: without this section the check skips. With a mapping, any page
# whose frontmatter type is not allowed in its top-level folder is a lint
# finding. Exempts meta/, .reciclaje/, root pages and _index.md. Each type
# maps to a NON-EMPTY list of top-level folders (use exempt_folders or
# type-specific meta pages instead of empty lists). ${VAR} macros work.
#
#layout:
#  type_folders:
#    source: [sources]
#    concept: [concepts]
#    decision: [decisions]
#    entity: [entities]
#  require_type: true
