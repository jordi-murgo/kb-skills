# Per-project config for the kb-skills pipelines.
# Copy to kb-config.yaml at your vault root and fill in.
#
# Every value here used to be hardcoded in the scripts. Nothing project-specific
# belongs in skill code.
#
# PATHS ARE RELATIVE to the vault root. Absolute paths, ~ and .. traversal are
# rejected — the scripts refuse to run rather than write outside the vault. This
# is enforced, not conventional: Python lets an absolute value replace the root
# entirely while PowerShell's Join-Path does not, so the same file would mean two
# different things depending on which pipeline read it.
#
# CREDENTIALS never live here. Jira reads ATLASSIAN_EMAIL and ATLASSIAN_API_KEY
# from the environment or .env.local. The historical misspelling ATLASIAN_* (one
# S) still works so existing vaults keep running, but it warns.
#
# JSON is still accepted (kb-config.json) so projects can migrate at their own
# pace. YAML needs PyYAML in Python; graph-fetch.ps1 installs powershell-yaml on
# demand, the same way it installs the Microsoft.Graph modules.

project:
  name: myproject
  keywords:
    - myproject
    - add terms that identify your project in mail and chat

jira:
  enabled: false
  base_url: https://yourorg.atlassian.net
  project_key: PROJ
  # Rendered Markdown, one file per issue. Committed — this is the artefact.
  output_dir: .raw/jira
  # Verbatim API payloads. Gitignored and disposable: they exist so the renderer
  # can be fixed and re-run (--render-only) without re-fetching the project,
  # which costs Atlassian API points. Delete freely; the next run refills it.
  cache_dir: .cache/jira

wiki_publish:
  enabled: false
  # Target wiki platform: "github" (default) or "gitlab".
  # GitHub Wiki uses Home.md (capital H) as landing page; GitLab uses home.md.
  target: github
  repo: git@github.com:user/project.wiki.git
  branch: main
  # push.sh resolves vpn_host and aborts unless it lands under
  # vpn_private_prefix. Set vpn_required to false outside a corporate network.
  vpn_required: false
  vpn_host: github.com
  vpn_private_prefix: "10."

m365:
  enabled: false

  modules:
    emails: true
    chats: true
    teams_channels: true
    attachments: true
    chat_attachments: true
    # transcripts requires the OnlineMeetingTranscript.Read.All delegated scope,
    # which needs admin consent. Enabling it without consent makes the whole
    # sign-in fail, not just this module.
    transcripts: false
    sharepoint: false

  # Enabling sharepoint requires site_host and site_path.
  sharepoint:
    site_host: ""
    site_path: ""
    folder_path: ""
    max_depth: 3

  output:
    dir: .raw/msoffice
    attachments_dir: .raw/msoffice/attachments
    chat_attachments_dir: .raw/msoffice/chat-attachments
    transcripts_dir: .raw/msoffice/transcripts
    sharepoint_dir: .raw/sharepoint

  window:
    hours: 24
    top: 100
    chat_limit: 50

# --- vault tooling (wiki-semsearch / wiki-vetting) ---
# Optional: without these sections everything targets a local Ollama on
# 127.0.0.1:11434. Values support ${VAR} and ${VAR:-default} macros expanded
# from the environment (process env, then vault-root .env / .env.local —
# see .env.example). CLI flags beat config values.

embeddings:
  # wiki-semsearch index model (multilingual recommended: bge-m3, qwen3-embedding)
  model: ${WIKI_SEM_MODEL:-bge-m3}
  endpoint: ${WIKI_OLLAMA_URL:-http://127.0.0.1:11434}
  # Index location (relative to vault root). Derived cache: deletable anytime.
  db: .vault-meta/sem/index.db

decisions:
  # wiki-vetting System One server (base URL; /v1/systemone is appended).
  # questions are a RECORD keyed by id.
  model: ${WIKI_VET_MODEL:-clef-flash:9b}
  endpoint: ${WIKI_OLLAMA_URL:-http://127.0.0.1:11434}

repos:
  # Related repos this KB tracks (wiki-git-ingest). Map keyed by name;
  # exactly ONE forge key per entry; optional target_page (default
  # wiki/x-radar/<name>.md); ${VAR} macros work.
  # GitHub public — releases.atom, no key:
  llama-cpp:
    github: ggml-org/llama.cpp
    target_page: wiki/x-radar/llama-cpp.md
  # GitHub Enterprise or any Atom feed — full URL:
  #ghe-repo:
  #  atom: https://github.enterprise.example/org/repo/releases.atom
  # GitLab (self-hosted or gitlab.com) — REST v4 releases; token_env names
  # an env var holding a read_api personal access token for private projects:
  #gft-repo:
  #  gitlab: git.gft.com/group/project
  #  token_env: GFT_GITLAB_TOKEN
  # Bitbucket Cloud — tags:
  #bb-repo:
  #  bitbucket: workspace/repo
  # Azure DevOps — tags refs; token_env holds a PAT (Basic auth):
  #azdo-repo:
  #  azure: gft-assets/gft-ai-platform/agentic-ai-call
  #  token_env: AZDO_PAT
  # Git URLs paste as-is (ssh or https, nested groups, .git suffix):
  #gft-nested:
  #  gitlab: git@git.gft.com:group/subgroup/project.git
  #  token_env: GFT_GITLAB_TOKEN
  # Any local clone (any forge) — git log + CHANGELOG.md, read-only:
  #my-spike:
  #  path: ../my-project-spike
  #  target_page: wiki/spike/my-spike.md
